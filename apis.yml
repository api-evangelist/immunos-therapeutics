description: >-
  Immunos Therapeutics is a privately held biotechnology company focused on harnessing the immune
  system to treat cancer and inflammatory diseases. The company develops immuno-oncology and
  immunomodulatory therapeutic candidates, advancing a preclinical and clinical pipeline supported
  by scientific and clinical advisory boards. Immunos Therapeutics is a portfolio company of
  Lightspeed Venture Partners. As a therapeutics/drug-development company it operates in the life
  sciences rather than as a software API provider, and publishes no public developer API, SDK, or
  developer documentation at this time. This profile is maintained in the API Evangelist network for
  company and portfolio discovery.
